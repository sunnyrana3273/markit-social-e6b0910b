<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkIt: Learning but better</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Lovable Generated Project" />
    <meta name="author" content="Lovable" />
    <script>
      // Ensure light mode is set before React loads to prevent FOUC
      (function() {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      })();
    </script>

    <meta property="og:title" content="whiteboard-wisdom-hub" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Homemade+Apple&family=Lexend+Deca:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      /* Critical CSS: Ensure background is applied immediately before React loads */
      html {
        background-color: hsl(0 0% 100%);
      }
      html.dark {
        background-color: hsl(0 0% 8%);
      }
    </style>
  </body>
</html>
